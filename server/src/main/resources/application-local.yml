spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/quotegarden
    username: quotegarden
    password: quotegarden
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
