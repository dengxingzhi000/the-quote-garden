spring:
  application:
    name: quotegarden-server

  # Default profile = `local` so `bootRun` works out-of-the-box against the
  # docker-compose Postgres on localhost:5432 (see application-local.yml).
  # Production deploys MUST export SPRING_PROFILES_ACTIVE=prod to skip the
  # local profile and rely solely on SPRING_DATASOURCE_* env vars below.
  profiles:
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Neon free tier routes through PgBouncer in transaction mode, which
    # rejects server-side prepared statements and shared connection state.
    # Disable both, and pin a sane maximum-pool-size that fits the 512 MB
    # Render free tier.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      data-source-properties:
        prepareThreshold: 0
        cachePrepStmts: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
